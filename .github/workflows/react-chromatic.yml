name: Chromatic React

# One build per pull request, not one per push. A snapshot is billed whether
# or not anything changed (copied snapshots still bill at 0.2 each), so a
# build per push cost ~3.1 builds per PR for a review nobody read: these
# builds post no status back to the PR. Approval is the point where the diff
# is worth looking at, and it captures the state that is about to merge.
#
# PRs merged without an approval get no build here. They are covered by the
# `rc` push build in react-release.yml, which is also what keeps the baseline
# current for the next PR.
on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

# A second approval on the same PR supersedes the first while it is still
# running; once it has finished, the `guard` job below is what stops a second
# approval from paying for the same snapshots twice.
concurrency:
  group: chromatic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Every approval fires this workflow, and most pull requests here collect two.
  # The build is keyed to the head commit, so the second approval of an unchanged
  # head would re-buy the same snapshots. The sticky comment records the commit it
  # was built from; if that commit is still the head, there is nothing new to see.
  # A push after the approval moves the head, so re-approving does rebuild.
  #
  # A change under `.storybook/`, to a file `preview.tsx` imports, or to the
  # version of a package it imports makes Chromatic snapshot every story in
  # full, and the `rc` build after the merge has to do the same full build
  # again. So such a PR gets no approval build: the `rc` build is the one full
  # build, and it comments on the merged PR if it finds visual changes. Run
  # the workflow by hand to see the diff before merging.
  guard:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # the skip notice is posted to the PR
    # `pull_request_review` has no `branches:` filter, so the base branch is
    # checked here. Note the dependabot check reads the PR author, not
    # `github.actor`, which on a review event is the reviewer.
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.review.state == 'approved' &&
        (github.event.pull_request.base.ref == 'rc' || github.event.pull_request.base.ref == 'main') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login != 'dependabot[bot]'
      )
    outputs:
      build: ${{ steps.check.outputs.build }}
      previous: ${{ steps.check.outputs.previous }}
    steps:
      # Only the shared script is needed, from the head being approved.
      - name: Checkout
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: .github/scripts

      - name: Does this head need a build?
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('build', 'yes');
              return;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const baseline = require('./.github/scripts/chromatic-baseline.cjs');
            const { comments, built, previous } = await baseline({ github, context, core }, issue_number);
            previous.delete(sha);
            core.setOutput('previous', [...previous].join(' '));
            if (built.has(sha)) {
              core.info(`${sha} already has a Chromatic build; skipping this approval.`);
              core.setOutput('build', 'no');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: issue_number, per_page: 100,
            });
            // The `src/` files `.storybook/preview.tsx` imports, read from
            // preview-stats.json. TurboSnap traces a change to any of them up to
            // the preview and rebuilds every story. A new preview import belongs
            // here too; missing one only costs a second full build.
            const previewImports = [
              'src/community/styles/index.scss',
              'src/tedi/helpers/hooks/use-what-input.ts',
              'src/tedi/providers/accessibility-provider/accessibility-provider.tsx',
              'src/tedi/providers/label-provider/index.ts',
              'src/tedi/providers/label-provider/label-provider.tsx',
              'src/tedi/providers/label-provider/labels-map.ts',
              'src/tedi/providers/label-provider/use-labels.tsx',
              'src/tedi/providers/printing-provider/index.ts',
              'src/tedi/providers/printing-provider/printing-provider.tsx',
              'src/tedi/providers/theme-provider/theme-provider.tsx',
              'src/tedi/styles/index.scss',
            ];
            // The packages the preview reaches that a PR would upgrade.
            const previewPackages =
              /^[-+]\s*"(react|react-dom|storybook|dayjs|@storybook\/[^"]+|@mui\/[^"]+|@emotion\/[^"]+|@tedi-design-system\/core)"/m;
            const forcesFullBuild = (f) =>
              f.filename.startsWith('.storybook/') ||
              previewImports.includes(f.filename) ||
              (f.filename === 'package.json' && previewPackages.test(f.patch ?? ''));
            const config = files.filter(forcesFullBuild).map((f) => f.filename);
            if (config.length === 0) {
              core.setOutput('build', 'yes');
              return;
            }
            core.info(`Skipping: this PR changes ${config.join(', ')}, which forces a full build.`);
            core.setOutput('build', 'no');
            const marker = '<!-- chromatic-skip -->';
            const body = [
              marker,
              '## 🎨 Chromatic',
              '',
              `This pull request changes ${config.map((name) => `\`${name}\``).join(', ')}, which makes Chromatic snapshot every story. The approval build is skipped so that full build is paid for once: the \`rc\` build after the merge runs it and comments its result here if it finds visual changes.`,
              '',
              'To see the visual diff before merging, run the **Chromatic React** workflow by hand on this branch.',
            ].join('\n');
            const existing = comments.find((c) => c.body?.includes(marker));
            if (!existing) await github.rest.issues.createComment({ owner, repo, issue_number, body });

  chromatic:
    needs: guard
    if: needs.guard.outputs.build == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the result is posted back to the PR
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: |
          npm ci --cache .npm --prefer-offline

      # Chromatic compares against this PR's previous build. After a
      # force-push its commit is no longer on the branch, so Chromatic would
      # fall back to a much older build and rebuild everything. GitHub still
      # serves the commit by SHA.
      - name: Fetch the commit of the previous build
        if: needs.guard.outputs.previous != ''
        continue-on-error: true
        env:
          SHAS: ${{ needs.guard.outputs.previous }}
        run: |
          for sha in $SHAS; do
            git fetch --no-tags origin "$sha" || echo "::warning::Could not fetch ${sha}"
          done

      # chromaui/action rather than the raw CLI, for the build result as step
      # outputs. Chromatic's GitHub App has never posted a UI Tests status on
      # a PR head commit in this repo, only on rc, so without this the one
      # build we now spend per PR would report nothing back to the PR.
      - name: Publish to Chromatic
        id: chromatic
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_TOKEN }}
          exitZeroOnChanges: true

      - name: Comment the result on the pull request
        if: github.event_name == 'pull_request_review' && steps.chromatic.outputs.changeCount != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          CHANGE_COUNT: ${{ steps.chromatic.outputs.changeCount }}
          BUILD_URL: ${{ steps.chromatic.outputs.buildUrl }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const marker = '<!-- chromatic-pr -->';
            const count = Number(process.env.CHANGE_COUNT);
            // The commit is named in the comment, and the machine-readable copy
            // is what the `guard` job reads to skip a repeat build of this head.
            const body = [
              marker,
              `<!-- chromatic-sha:${sha} -->`,
              '## 🎨 Chromatic',
              '',
              count > 0 ? `${count} visual change(s) to review before merging.` : 'No visual changes.',
              '',
              `Built from \`${sha.slice(0, 7)}\`. Commits pushed after this are not covered; approve again to rebuild.`,
              '',
              `[View the build](${process.env.BUILD_URL})`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # actualCaptureCount is what is billed at 1x and inheritedCaptureCount is
      # what TurboSnap copied at 0.2x, so this is the real per-build cost
      # against the monthly quota rather than an estimate.
      - name: Record the snapshot usage
        if: always()
        env:
          CAPTURED: ${{ steps.chromatic.outputs.actualCaptureCount }}
          INHERITED: ${{ steps.chromatic.outputs.inheritedCaptureCount }}
          CHANGES: ${{ steps.chromatic.outputs.changeCount }}
          ERRORS: ${{ steps.chromatic.outputs.errorCount }}
          SPECS: ${{ steps.chromatic.outputs.specCount }}
          BUILD_URL: ${{ steps.chromatic.outputs.buildUrl }}
        run: |
          {
            echo "### Chromatic"
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| Stories | ${SPECS:-n/a} |"
            echo "| Captured (billed 1x) | ${CAPTURED:-n/a} |"
            echo "| Inherited via TurboSnap (billed 0.2x) | ${INHERITED:-n/a} |"
            echo "| Visual changes | ${CHANGES:-n/a} |"
            echo "| Errored stories | ${ERRORS:-n/a} |"
            echo "| Build | ${BUILD_URL:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"
