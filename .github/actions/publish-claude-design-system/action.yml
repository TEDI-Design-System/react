name: Publish to claude-design-system
description: >
  Replaces the files on a release line of TEDI-Design-System/claude-design-system with the
  release tree the build job uploaded. main gets a new commit tagged with the release; rc is
  force-pushed as a single parentless commit.

inputs:
  line:
    description: main or rc
    required: true
  tag:
    description: The react-<version> release tag
    required: true
  version:
    description: The release version
    required: true
  commit:
    description: The React repository commit the files were built from
    required: true
  token:
    description: A token with contents write on claude-design-system
    required: true

runs:
  using: composite
  steps:
    - name: Checkout claude-design-system
      uses: actions/checkout@v4
      with:
        repository: TEDI-Design-System/claude-design-system
        token: ${{ inputs.token }}
        path: claude-design-system
        fetch-depth: 0

    - name: Clear the release line
      shell: bash
      working-directory: claude-design-system
      env:
        LINE: ${{ inputs.line }}
      run: |
        if [ "$LINE" = main ] && git ls-remote --exit-code --heads origin main > /dev/null; then
          git checkout main
        else
          git checkout --orphan "publish-$LINE"
        fi
        git rm -rq --ignore-unmatch .

    - name: Download the release tree
      uses: actions/download-artifact@v4
      with:
        name: claude-design-system
        path: claude-design-system

    - name: Commit and push
      shell: bash
      working-directory: claude-design-system
      env:
        LINE: ${{ inputs.line }}
        TAG: ${{ inputs.tag }}
        VERSION: ${{ inputs.version }}
        COMMIT: ${{ inputs.commit }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -q -m "TEDI $VERSION" -m "From TEDI-Design-System/react@${COMMIT::8} ($TAG)."
        if [ "$LINE" = main ]; then
          git tag "$TAG"
          git push origin HEAD:main "$TAG"
        else
          git push --force origin HEAD:rc
        fi
